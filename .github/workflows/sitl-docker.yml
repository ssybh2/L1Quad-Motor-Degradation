name: DSun SITL Docker build

on:
  push:
    branches:
      - dsun-sitl-docker
  workflow_dispatch:

jobs:
  build-sitl-in-docker:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build pinned SITL Docker image
        run: docker compose build

      - name: Compile PX4 SITL with DSun/L1 and Gazebo bridge
        run: |
          docker compose run --rm --user 0:0 sitl bash -lc '
            set -euo pipefail
            mkdir -p "$HOME"
            git config --global --add safe.directory "*"
            ./scripts/install_sitl.sh ./PX4-Autopilot
            make -C ./PX4-Autopilot px4_sitl_default -j2
            test -f ./PX4-Autopilot/build/px4_sitl_default/src/modules/l1_adaptive_control/libmodules__l1_adaptive_control.a
            test -f ./PX4-Autopilot/build/px4_sitl_default/src/modules/simulation/gz_bridge/libmodules__simulation__gz_bridge.a
            gz sim --versions
            echo "DSun/L1 + Gazebo bridge SITL build verified"
          '

      - name: Headless Gazebo X500 smoke test
        run: |
          set -euo pipefail
          name="l1quad-sitl-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose run -d --name "$name" --user 0:0 -e HEADLESS=1 sitl bash -lc '
            set -euo pipefail
            mkdir -p "$HOME"
            git config --global --add safe.directory "*"
            ./scripts/install_sitl.sh ./PX4-Autopilot
            make -C ./PX4-Autopilot px4_sitl gz_x500
          '

          sleep 25
          docker logs "$name" 2>&1 | tee /tmp/gz_x500.log

          if [[ "$(docker inspect -f "{{.State.Running}}" "$name")" != "true" ]]; then
            echo "Gazebo X500 container exited during startup" >&2
            docker inspect "$name" >&2 || true
            exit 1
          fi

          if grep -q 'Gazebo simulation dependencies not found' /tmp/gz_x500.log; then
            echo "Gazebo dependencies are still missing" >&2
            exit 1
          fi

          grep -E 'gz_bridge|Gazebo|PX4|pxh>|Ready for takeoff|l1_adaptive_control' /tmp/gz_x500.log | tail -n 80 || true
          echo "Headless Gazebo X500 stayed alive for the smoke-test window"

      - name: Show SITL integration config
        if: always()
        run: |
          grep -n 'CONFIG_MODULES_L1_ADAPTIVE_CONTROL' ./PX4-Autopilot/boards/px4/sitl/default.px4board || true
