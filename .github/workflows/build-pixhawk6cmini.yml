name: Build Pixhawk 6C Mini firmware

on:
  push:
    branches:
      - refactor/mode-adaptive-source-equivalent
    paths:
      - ".github/workflows/build-pixhawk6cmini.yml"
      - ".gitmodules"
      - "PX4-Autopilot"
      - "l1_adaptive_control/**"
      - "patches/**"
      - "scripts/install_main.sh"
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    container:
      image: px4io/px4-dev-nuttx-jammy:latest

    steps:
      - name: Checkout repository and PX4 submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned PX4 revision
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory '*'
          test "$(git -C PX4-Autopilot rev-parse HEAD)" = "d6f12ad1c4f70ad3230afd7d86e971421e02fef4"

      - name: Install source-equivalent L1 integration
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/install_main.sh ./PX4-Autopilot

      - name: Build px4_fmu-v6c_default
        shell: bash
        run: |
          set -euxo pipefail
          make -C ./PX4-Autopilot px4_fmu-v6c_default -j2

      - name: Verify firmware output
        shell: bash
        run: |
          set -euxo pipefail
          test -s ./PX4-Autopilot/build/px4_fmu-v6c_default/px4_fmu-v6c_default.px4
          ls -lh ./PX4-Autopilot/build/px4_fmu-v6c_default/px4_fmu-v6c_default.px4
          sha256sum ./PX4-Autopilot/build/px4_fmu-v6c_default/px4_fmu-v6c_default.px4

      - name: Upload PX4 firmware
        uses: actions/upload-artifact@v4
        with:
          name: L1Quad-mode-adaptive-source-equivalent-pixhawk6cmini
          path: ./PX4-Autopilot/build/px4_fmu-v6c_default/px4_fmu-v6c_default.px4
          if-no-files-found: error
          retention-days: 30
